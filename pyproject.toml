[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "highscore"
version = "0.1.0"
description = "Highscore-API für ein Spiel mit den Modi classic, medium und pro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools]
py-modules = ["highscore_api", "highscore_service", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]